name: iOS Full Security Analysis

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "URL to IPA file (optional, defaults to DVIA-v2)"
        required: false
        default: "https://github.com/prateek147/DVIA-v2/releases/download/v2.0/DVIA-v2-swift.ipa"

jobs:
  static-analysis:
    name: "Static Analysis (MobSF)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download IPA
        run: |
          IPA_URL="${{ github.event.inputs.ipa_url || 'https://github.com/prateek147/DVIA-v2/releases/download/v2.0/DVIA-v2-swift.ipa' }}"
          curl -L -o app.ipa "$IPA_URL"
          ls -lh app.ipa

      - name: Start MobSF
        run: |
          docker run -d --name mobsf -p 8000:8000 \
            opensecurity/mobile-security-framework-mobsf:latest
          until curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/ | grep -q "200\|302"; do sleep 3; done

      - name: Get MobSF API key
        run: |
          MOBSF_API_KEY=$(docker exec mobsf python3 -c "
          import os, sys
          sys.path.insert(0, '/home/mobsf/Mobile-Security-Framework-MobSF')
          os.environ['MOBSF_HOME'] = '/home/mobsf/.MobSF'
          from mobsf.MobSF.init import api_key
          print(api_key('/home/mobsf/.MobSF'))
          " 2>/dev/null)
          echo "MOBSF_API_KEY=$MOBSF_API_KEY" >> $GITHUB_ENV

      - name: Upload & Scan IPA
        run: |
          UPLOAD=$(curl -s -F "file=@app.ipa" \
            -H "Authorization: $MOBSF_API_KEY" \
            http://localhost:8000/api/v1/upload)
          HASH=$(echo "$UPLOAD" | python3 -c "import sys,json; print(json.load(sys.stdin)['hash'])")
          echo "SCAN_HASH=$HASH" >> $GITHUB_ENV

          curl -s -X POST http://localhost:8000/api/v1/scan \
            -H "Authorization: $MOBSF_API_KEY" \
            -d "hash=$HASH&scan_type=ipa&file_name=app.ipa&re_scan=0" > /dev/null
          echo "Scan complete, hash: $HASH"

      - name: Download Reports
        run: |
          mkdir -p reports
          # JSON report
          curl -s -X POST http://localhost:8000/api/v1/report_json \
            -H "Authorization: $MOBSF_API_KEY" \
            -d "hash=$SCAN_HASH" > reports/mobsf-static.json
          # PDF report
          curl -s -X POST http://localhost:8000/api/v1/download_pdf \
            -H "Authorization: $MOBSF_API_KEY" \
            -d "hash=$SCAN_HASH" -o reports/mobsf-static.pdf
          ls -lh reports/

      - name: Parse findings
        run: |
          python3 - << 'EOF'
          import json
          with open('reports/mobsf-static.json') as f:
              d = json.load(f)
          print("=== MobSF Static Analysis ===")
          print(f"App: {d.get('app_name')} v{d.get('app_version')}")
          ats = d.get('ats_analysis', {}).get('ats_findings', [])
          for f in ats:
              print(f"[{f['severity'].upper()}] ATS: {f['issue']}")
          ba = d.get('binary_analysis', {}).get('findings', {})
          for name, det in ba.items():
              print(f"[{det.get('severity','?').upper()}] {name}")
          print(f"URLs found: {len(d.get('urls', []))}")
          EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: reports/

  dynamic-analysis:
    name: "Dynamic Analysis (Frida + iOS Simulator)"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Xcode CLT
        run: xcode-select --install 2>/dev/null || true

      - name: Install Frida & tools
        run: |
          brew install coreutils
          # venv чтобы все инструменты использовали одну версию frida
          python3 -m venv /tmp/frida-venv
          /tmp/frida-venv/bin/pip install -q frida frida-tools objection
          echo "FRIDA_BIN=/tmp/frida-venv/bin" >> "$GITHUB_ENV"
          /tmp/frida-venv/bin/frida --version
          /tmp/frida-venv/bin/pip show objection | grep Version

      - name: Boot iOS Simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          for runtime, devices in d['devices'].items():
              if 'iOS' in runtime:
                  for dev in devices:
                      if 'iPhone' in dev.get('name','') and dev.get('isAvailable', False):
                          print(dev['udid'])
                          exit()
          ")
          if [ -z "$UDID" ]; then
            echo "ERROR: No iPhone simulator found!"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Booting UDID: $UDID"
          xcrun simctl boot "$UDID" || true
          until xcrun simctl list devices | grep "$UDID" | grep -q "Booted"; do sleep 3; done
          echo "$UDID" > "$GITHUB_WORKSPACE/sim_udid.txt"
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          echo "Simulator ready: $UDID"
          cat "$GITHUB_WORKSPACE/sim_udid.txt"

      - name: Clone DVIA-v2 source
        run: |
          git clone --depth 1 https://github.com/prateek147/DVIA-v2.git "$GITHUB_WORKSPACE/DVIA-v2"
          ls "$GITHUB_WORKSPACE/DVIA-v2/"

      - name: Install CocoaPods dependencies
        working-directory: DVIA-v2/DVIA-v2
        run: |
          ls -la
          pod install

      - name: Build DVIA-v2 for iOS Simulator
        run: |
          SIM_UDID=$(cat "$GITHUB_WORKSPACE/sim_udid.txt")
          echo "Building for simulator: $SIM_UDID"
          cd "$GITHUB_WORKSPACE/DVIA-v2/DVIA-v2"
          xcodebuild -workspace DVIA-v2.xcworkspace -list 2>&1
          xcodebuild \
            -workspace DVIA-v2.xcworkspace \
            -scheme DVIA-v2 \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath "$GITHUB_WORKSPACE/DVIA-v2/DVIA-v2/DerivedData" \
            CODE_SIGNING_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            SWIFT_VERSION=5 \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            build 2>&1 | grep -E "error:|BUILD SUCCEEDED|BUILD FAILED|warning: Swift" | tail -30 || true
          find "$GITHUB_WORKSPACE/DVIA-v2/DVIA-v2/DerivedData" -name "DVIA-v2.app" -not -path "*/dSYM/*" | head -3

      - name: Verify Frida sees simulator
        run: |
          SIM_UDID=$(cat "$GITHUB_WORKSPACE/sim_udid.txt")
          echo "Using UDID: $SIM_UDID"
          $FRIDA_BIN/frida-ps -D "$SIM_UDID" | head -15

      - name: Install app on simulator
        run: |
          SIM_UDID=$(cat "$GITHUB_WORKSPACE/sim_udid.txt")
          mkdir -p reports
          APP_PATH=$(find "$GITHUB_WORKSPACE/DVIA-v2/DVIA-v2/DerivedData" -name "DVIA-v2.app" -not -path "*/dSYM/*" 2>/dev/null | head -1)
          if [ -n "$APP_PATH" ]; then
            echo "Installing DVIA-v2 from: $APP_PATH"
            xcrun simctl install "$SIM_UDID" "$APP_PATH" 2>&1 || echo "Install failed (will try Safari spawn)"
          else
            echo "DVIA-v2 not found in DerivedData"
          fi
          echo "Installed apps:"
          xcrun simctl listapps "$SIM_UDID" 2>/dev/null | python3 -c "
import sys,json
apps=json.load(sys.stdin)
for bid,info in apps.items():
    if 'DVIA' in bid or 'safari' in bid.lower():
        print(f'  {bid}')" || true

      - name: Frida dynamic analysis (Python spawn API)
        run: |
          SIM_UDID=$(cat "$GITHUB_WORKSPACE/sim_udid.txt")
          mkdir -p "$GITHUB_WORKSPACE/reports"

          # Записать Python-скрипт во временный файл
          cat > /tmp/frida_spawn.py << 'PYEOF'
import frida, sys, time, os

sim_udid = sys.argv[1]
reports_dir = sys.argv[2]
os.makedirs(reports_dir, exist_ok=True)

print(f"[+] Connecting to simulator {sim_udid}...")
try:
    device = frida.get_device(sim_udid, timeout=15)
    print(f"[+] Device: {device.name} ({device.id})")
except Exception as e:
    print(f"[-] Cannot get device: {e}")
    sys.exit(0)

HOOK_JS = r"""
// ===== ObjC CLASS ENUMERATION =====
(function() {
  if (!ObjC.available) { send('[INFO] ObjC not available'); return; }
  try {
    var loaded = ObjC.enumerateLoadedClassesSync();
    var total = 0;
    for (var img in loaded) {
      if (img.indexOf('.app') !== -1) {
        var cls = loaded[img];
        send('[CLASS_IMG] ' + img + ' (' + cls.length + ' classes)');
        cls.forEach(function(c) { send('[CLASS] ' + c); total++; });
      }
    }
    send('[CLASS_TOTAL] App-owned classes: ' + total);
  } catch(e) { send('[CLASS_ERR] ' + e); }
})();

// ===== NETWORK HOOKS =====
(function() {
  if (!ObjC.available) return;
  try {
    var NSURLSession = ObjC.classes.NSURLSession;
    var m = NSURLSession['- dataTaskWithRequest:completionHandler:'];
    if (m) {
      Interceptor.attach(m.implementation, {
        onEnter: function(args) {
          try {
            var req = new ObjC.Object(args[2]);
            send('[NETWORK] ' + req.URL().toString() + ' [' + req.HTTPMethod().toString() + ']');
          } catch(e) {}
        }
      });
    }
    var m2 = NSURLSession['- dataTaskWithURL:completionHandler:'];
    if (m2) {
      Interceptor.attach(m2.implementation, {
        onEnter: function(args) {
          try { send('[NETWORK] URL: ' + new ObjC.Object(args[2]).toString()); } catch(e) {}
        }
      });
    }
    send('[NETWORK_HOOK] NSURLSession hooks installed');
  } catch(e) { send('[NETWORK_ERR] ' + e); }
})();

// ===== KEYCHAIN HOOKS =====
(function() {
  try {
    var SecItemCopyMatching = Module.findExportByName('Security', 'SecItemCopyMatching');
    if (SecItemCopyMatching) {
      Interceptor.attach(SecItemCopyMatching, {
        onEnter: function(args) { send('[KEYCHAIN] SecItemCopyMatching called'); },
        onLeave: function(ret) { send('[KEYCHAIN] result=' + ret.toInt32()); }
      });
    }
    var SecItemAdd = Module.findExportByName('Security', 'SecItemAdd');
    if (SecItemAdd) {
      Interceptor.attach(SecItemAdd, {
        onEnter: function(args) { send('[KEYCHAIN] SecItemAdd called'); }
      });
    }
    send('[KEYCHAIN_HOOK] Keychain hooks installed');
  } catch(e) { send('[KEYCHAIN_ERR] ' + e); }
})();

// ===== NSUSERDEFAULTS HOOKS =====
(function() {
  if (!ObjC.available) return;
  try {
    var UD = ObjC.classes.NSUserDefaults;
    var setObj = UD['- setObject:forKey:'];
    if (setObj) {
      Interceptor.attach(setObj.implementation, {
        onEnter: function(args) {
          try {
            var key = new ObjC.Object(args[3]).toString();
            var val = new ObjC.Object(args[2]).toString();
            send('[DEFAULTS] SET ' + key + ' = ' + val.substring(0,100));
          } catch(e) {}
        }
      });
    }
    var setBool = UD['- setBool:forKey:'];
    if (setBool) {
      Interceptor.attach(setBool.implementation, {
        onEnter: function(args) {
          try { send('[DEFAULTS] SETBOOL ' + new ObjC.Object(args[3]).toString()); } catch(e) {}
        }
      });
    }
    send('[DEFAULTS_HOOK] NSUserDefaults hooks installed');
  } catch(e) { send('[DEFAULTS_ERR] ' + e); }
})();

// ===== CRYPTO HOOKS =====
(function() {
  try {
    var CCCrypt = Module.findExportByName(null, 'CCCrypt');
    if (CCCrypt) {
      Interceptor.attach(CCCrypt, {
        onEnter: function(args) { send('[CRYPTO] CCCrypt op=' + args[0].toInt32()); }
      });
    }
    send('[CRYPTO_HOOK] Crypto hooks installed, CCCrypt=' + (CCCrypt ? 'found' : 'not found'));
  } catch(e) { send('[CRYPTO_ERR] ' + e); }
})();

// ===== FILE ACCESS HOOKS =====
(function() {
  if (!ObjC.available) return;
  try {
    var FM = ObjC.classes.NSFileManager;
    var exists = FM['- fileExistsAtPath:'];
    if (exists) {
      Interceptor.attach(exists.implementation, {
        onEnter: function(args) {
          try {
            var p = new ObjC.Object(args[2]).toString();
            if (p && !p.startsWith('/System') && !p.startsWith('/usr')) {
              send('[FILE] exists: ' + p);
            }
          } catch(e) {}
        }
      });
    }
    send('[FILE_HOOK] NSFileManager hooks installed');
  } catch(e) { send('[FILE_ERR] ' + e); }
})();

send('[FRIDA_READY] All hooks active, waiting for app activity...');
"""

output = []
errors = []

def on_msg(m, d):
    if m['type'] == 'send':
        line = str(m['payload'])
        print(line, flush=True)
        output.append(line)
    elif m['type'] == 'error':
        err = m.get('description', str(m))
        print('[JS-ERR] ' + err, flush=True)
        errors.append(err)

def try_spawn(bundle_id, label, collect_secs=30):
    print(f"\n[+] Spawning {label} ({bundle_id})...")
    try:
        pid = device.spawn(bundle_id)
        print(f"[+] Spawned PID={pid}")
        session = device.attach(pid)
        script = session.create_script(HOOK_JS)
        script.on('message', on_msg)
        script.load()
        device.resume(pid)
        print(f"[+] App running, collecting for {collect_secs}s...")
        time.sleep(collect_secs)
        try:
            session.detach()
        except:
            pass
        return True
    except Exception as e:
        print(f"[-] Spawn/attach failed for {label}: {e}")
        return False

# Попытка 1: DVIA-v2 (уязвимое приложение для анализа)
ok = try_spawn("com.highaltitudehacks.DVIAswiftv2", "DVIA-v2", 30)

# Попытка 2: MobileSafari (всегда доступен)
if not ok:
    output.append("[INFO] DVIA-v2 failed, trying MobileSafari")
    ok = try_spawn("com.apple.mobilesafari", "MobileSafari", 20)

# Попытка 3: SpringBoard (системный, всегда запущен)
if not ok:
    output.append("[INFO] MobileSafari failed, trying SpringBoard attach")
    try:
        procs = device.enumerate_processes()
        spring = next((p for p in procs if p.name == 'SpringBoard'), None)
        if spring:
            print(f"[+] Attaching to SpringBoard PID={spring.pid}...")
            session = device.attach(spring.pid)
            script = session.create_script(HOOK_JS)
            script.on('message', on_msg)
            script.load()
            time.sleep(15)
            session.detach()
            ok = True
    except Exception as e:
        print(f"[-] SpringBoard attach: {e}")

# Всегда показываем список процессов
try:
    procs = device.enumerate_processes()
    output.append("[PROCESSES] Running on simulator:")
    for p in procs:
        line = f"[PROCESS] PID={p.pid:6d}  {p.name}"
        print(line)
        output.append(line)
except Exception as e:
    print(f"[-] enumerate_processes: {e}")

# Сохранить отчёты
with open(f"{reports_dir}/frida-full.txt", "w") as f:
    f.write("\n".join(output))
with open(f"{reports_dir}/frida-classes.txt", "w") as f:
    f.write("\n".join(l for l in output if '[CLASS' in l))
with open(f"{reports_dir}/frida-network.txt", "w") as f:
    f.write("\n".join(l for l in output if '[NETWORK]' in l))
with open(f"{reports_dir}/frida-keychain.txt", "w") as f:
    f.write("\n".join(l for l in output if '[KEYCHAIN]' in l))
with open(f"{reports_dir}/frida-defaults.txt", "w") as f:
    f.write("\n".join(l for l in output if '[DEFAULTS]' in l))
with open(f"{reports_dir}/frida-crypto.txt", "w") as f:
    f.write("\n".join(l for l in output if '[CRYPTO]' in l))

print(f"\n[+] Total events captured: {len(output)}")
print(f"[+] Classes: {sum(1 for l in output if l.startswith('[CLASS]'))}")
print(f"[+] Network: {sum(1 for l in output if l.startswith('[NETWORK]'))}")
print(f"[+] Keychain: {sum(1 for l in output if l.startswith('[KEYCHAIN]'))}")
print(f"[+] Reports saved to {reports_dir}/")
PYEOF

          echo "=== Запуск Frida Python API (spawn mode) ==="
          $FRIDA_BIN/python3 /tmp/frida_spawn.py "$SIM_UDID" "$GITHUB_WORKSPACE/reports"

          echo ""
          echo "=== Итог (первые 60 строк frida-full.txt) ==="
          head -60 "$GITHUB_WORKSPACE/reports/frida-full.txt" || true
          echo ""
          wc -l "$GITHUB_WORKSPACE/reports/frida-"*.txt 2>/dev/null || true

      - name: Upload dynamic analysis reports
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-analysis-reports
          path: reports/

  semgrep-analysis:
    name: "Code Analysis (Semgrep)"
    runs-on: ubuntu-latest
    # Запускается если есть исходники Swift/ObjC в репозитории
    steps:
      - uses: actions/checkout@v4

      - name: Extract IPA sources (if available)
        run: |
          curl -L -o app.ipa \
            "https://github.com/prateek147/DVIA-v2/releases/download/v2.0/DVIA-v2-swift.ipa"
          mkdir -p extracted
          unzip -q app.ipa -d extracted/ || true
          find extracted/ -name "*.swift" -o -name "*.m" | head -5

      - uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/swift
            p/owasp-top-ten
          generateSarif: "1"
        continue-on-error: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true
